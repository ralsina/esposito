# Build, sign, and publish a firmware release when a version tag is pushed.
#
# Tag conventions:
#   vMAJOR.MINOR.PATCH            -> stable release
#   vMAJOR.MINOR.PATCH-beta.N     -> prerelease (also visible to devices
#                                     with the beta-channel toggle on)
#   vMAJOR.MINOR.PATCH-rc.N       -> prerelease
#   vMAJOR.MINOR.PATCH-pre.N      -> prerelease
#
# The signing key lives in the OTA_SIGNING_PRIVATE_KEY repository secret as a
# PEM-encoded EC PRIVATE KEY string. The matching public key is embedded in
# firmware at main/ota_keys.h; only firmware signed by this key will be
# accepted by OTA on devices.
#
# Secrets required:
#   OTA_SIGNING_PRIVATE_KEY  PEM ECDSA-P256 private key (one-line per PEM rule,
#                            newline-separated; we write it verbatim to a file)
#
# To rotate the key: generate a new keypair, replace main/ota_keys.h with the
# new public key, set OTA_SIGNING_PRIVATE_KEY to the new private key, commit,
# and cut a release. Devices running older firmware will need a one-time
# SD-card install (physical-access trusted path) to upgrade to the first
# release signed by the new key.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist in the repo)'
        required: true
        type: string

permissions:
  contents: write   # required by softprops/action-gh-release to create releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          submodules: false

      - name: Build CYD (ESP32) firmware + app bundle
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32
          path: .
          command: |
            apt-get update -qq && apt-get install -y -qq zip xxd > /dev/null 2>&1 || true
            idf.py build
            bash scripts/build_all_apps.sh
            python3 scripts/generate_catalog.py -o artifacts/app-store
            cd artifacts && zip -r -q app-store-bundle.zip app-store/ && cd ..
            bash scripts/build_release_bundle.sh artifacts/sdcard-bundle.zip "${{ steps.tag.outputs.name }}"
            # Stage CYD firmware
            mkdir -p artifacts/esp32
            cp build/esposito.bin artifacts/firmware.bin
            cp build/bootloader/bootloader.bin       artifacts/esp32/bootloader.bin
            cp build/partition_table/partition-table.bin artifacts/esp32/partition-table.bin
            cp build/ota_data_initial.bin            artifacts/esp32/ota_data_initial.bin
            echo "${{ steps.tag.outputs.name }}" > artifacts/version.txt

      - name: Build Guition (ESP32-S3) firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: .
          command: |
            apt-get update -qq && apt-get install -y -qq zip xxd > /dev/null 2>&1 || true
            idf.py build
            # Stage Guition firmware (use existing artifacts from CYD step)
            mkdir -p artifacts/esp32s3
            cp build/esposito.bin artifacts/firmware-esp32s3.bin
            cp build/bootloader/bootloader.bin       artifacts/esp32s3/bootloader.bin
            cp build/partition_table/partition-table.bin artifacts/esp32s3/partition-table.bin
            cp build/ota_data_initial.bin            artifacts/esp32s3/ota_data_initial.bin

      - name: Fix file ownership from Docker
        run: sudo chown -R $(id -u):$(id -g) build/ artifacts/

      - name: Generate ESP Web Tools manifest
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          cat > artifacts/manifest.json <<EOF
          {
            "name": "Esposito OS",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "esp32/bootloader.bin",       "offset": 4096 },
                  { "path": "esp32/partition-table.bin",  "offset": 32768 },
                  { "path": "firmware.bin",               "offset": 65536 },
                  { "path": "esp32/ota_data_initial.bin", "offset": 2162688 }
                ]
              },
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "esp32s3/bootloader.bin",       "offset": 0 },
                  { "path": "esp32s3/partition-table.bin",  "offset": 32768 },
                  { "path": "firmware-esp32s3.bin",         "offset": 65536 },
                  { "path": "esp32s3/ota_data_initial.bin", "offset": 2162688 }
                ]
              }
            ]
          }
          EOF

      - name: Write signing key from secret
        env:
          OTA_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$OTA_KEY" ]; then
            echo "ERROR: OTA_SIGNING_PRIVATE_KEY secret is not set." >&2
            exit 1
          fi
          printf '%s\n' "$OTA_KEY" > /tmp/ota_release_private.pem
          chmod 600 /tmp/ota_release_private.pem

      - name: Sign CYD firmware
        run: |
          bash scripts/sign_firmware.sh artifacts/firmware.bin /tmp/ota_release_private.pem

      - name: Sign Guition firmware
        run: |
          bash scripts/sign_firmware.sh artifacts/firmware-esp32s3.bin /tmp/ota_release_private.pem

      - name: Verify signatures
        run: |
          # Extract embedded public key from CYD firmware
          grep -oE '"[^"]*"' main/ota_keys.h \
            | sed 's/^"//; s/"$//; s/\\n$//' > /tmp/embedded_pub.pem
          # Verify both signatures
          openssl dgst -sha256 \
            -verify /tmp/embedded_pub.pem \
            -signature artifacts/firmware.bin.sig \
            artifacts/firmware.bin
          openssl dgst -sha256 \
            -verify /tmp/embedded_pub.pem \
            -signature artifacts/firmware-esp32s3.bin.sig \
            artifacts/firmware-esp32s3.bin

      - name: Shred signing key
        if: always()
        run: |
          if [ -f /tmp/ota_release_private.pem ]; then
            shred -u /tmp/ota_release_private.pem
          fi

      - name: Detect prerelease
        id: rel
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if [[ "$TAG" =~ -(beta|rc|pre)\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.rel.prerelease == 'true' }}
          files: |
            artifacts/firmware.bin
            artifacts/firmware.bin.sig
            artifacts/firmware.bin.sha256
            artifacts/firmware-esp32s3.bin
            artifacts/firmware-esp32s3.bin.sig
            artifacts/firmware-esp32s3.bin.sha256
            artifacts/esp32/bootloader.bin
            artifacts/esp32/partition-table.bin
            artifacts/esp32/ota_data_initial.bin
            artifacts/esp32s3/bootloader.bin
            artifacts/esp32s3/partition-table.bin
            artifacts/esp32s3/ota_data_initial.bin
            artifacts/manifest.json
            artifacts/sdcard-bundle.zip
            artifacts/app-store-bundle.zip
            artifacts/version.txt
